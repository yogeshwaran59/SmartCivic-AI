<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login &bull; SmartCivic AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #06090e;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-color: rgba(51, 65, 85, 0.6);
      --accent-blue: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #06090e 70%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.15);
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #10b981);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .emblem-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #818cf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(15, 23, 42, 0.95);
    }

    .pin-input {
      letter-spacing: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.45);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-links {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="emblem-icon">🛡️</div>
      <h1 class="brand-title">SmartCivic <span>AI</span></h1>
      <div class="brand-subtitle">Municipal Admin Portal</div>
    </div>

    {% if error %}
    <div class="error-banner">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label class="form-label" for="email">Admin Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" class="form-input" placeholder="admin@smartcivic.ai" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Master Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="pin">Master Security PIN</label>
        <div class="input-wrapper">
          <input type="password" id="pin" name="pin" maxlength="6" class="form-input pin-input" placeholder="••••" required autocomplete="off">
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>🔐</span> Authenticate & Enter Portal
      </button>
    </form>

    <div class="footer-links">
      <a href="/">&larr; Return to Public Citizen Portal</a>
    </div>
  </div>

</body>
</html>
